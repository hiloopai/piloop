[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "piloop"
version = "0.3.0"
description = "Autoresearch for any repo: coding agents try ideas, piloop scores every commit and keeps what wins"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Autoresearch, Inc." }]
keywords = ["autoresearch", "agents", "claude-code", "codex", "optimization", "experiments"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
]
dependencies = [
    "alembic>=1.16",
    "covalence==0.1.0.dev6",
    "boto3>=1.43.112",
    "cyclopts>=3.20",
    "fastapi>=0.161",
    "gitpython>=3.1.45",
    "httpx2>=2.12.0",
    "opentelemetry-exporter-otlp-proto-http>=1.34",
    "opentelemetry-sdk>=1.34",
    "psutil>=7",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.41",
    "textual>=8.2,<9",
    "uvicorn>=0.54",
]

[project.urls]
Homepage = "https://github.com/hiloopai/piloop"
Documentation = "https://piloop.autoresearch.inc"
Changelog = "https://github.com/hiloopai/piloop/blob/main/CHANGELOG.md"
Issues = "https://github.com/hiloopai/piloop/issues"

[project.scripts]
piloop = "piloop.cli.main:main"

# The commands of piloop itself, which load by their import path when they run (piloop.cli.main.COMMANDS).
[project.entry-points."piloop.commands"]
idea = "piloop.cli.idea:app"
candidate = "piloop.cli.candidate:app"
measurement = "piloop.cli.measurement:app"
eval = "piloop.cli.evaluation:app"
store = "piloop.cli.store:app"
token = "piloop.cli.token:app"
agent = "piloop.cli.agents:agent_app"
run = "piloop.cli.agents:run_app"
worker = "piloop.cli.worker:app"
limits = "piloop.cli.limits:app"
cas = "piloop.cli.cas:app"
secret = "piloop.cli.secret:app"
init = "piloop.cli.campaign:init"
history = "piloop.cli.campaign:history"
watch = "piloop.cli.campaign:watch_cmd"
pause = "piloop.cli.control:pause"
resume = "piloop.cli.control:resume"
restore = "piloop.cli.store:restore"
launch = "piloop.cli.agents:launch"
prompt = "piloop.cli.agents:prompt"
attach = "piloop.cli.agent_io:attach"
journal = "piloop.plugins.memory.local.cli:journal"
message = "piloop.cli.inbox:message"
wake = "piloop.cli.wake:wake"
serve = "piloop.cli.daemon:serve"
stop = "piloop.cli.daemon:stop"
restart = "piloop.cli.daemon:restart"
service-unit = "piloop.cli.daemon:service_unit_cmd"
sql = "piloop.cli.database:sql_cmd"
schema = "piloop.cli.database:schema"
migrate = "piloop.cli.database:migrate_cmd"
upgrade = "piloop.cli.install:upgrade"
doctor = "piloop.cli.install:doctor_cmd"
plugins = "piloop.cli.plugins:plugins_cmd"
install-skills = "piloop.cli.install:install_skills"

# The providers of piloop itself, in the groups that a plugin package uses (piloop.plugins.host).
[project.entry-points."piloop.capabilities"]
runtime = "piloop.plugins.runtime.contract:RUNTIMES"
cas = "piloop.plugins.cas.contract:CAS"
provisioner = "piloop.plugins.provisioner.contract:PROVISIONERS"
trigger = "piloop.plugins.trigger.contract:TRIGGERS"
role = "piloop.plugins.role.contract:ROLES"
verdict_rule = "piloop.plugins.campaign_type.kit.verdicts.verdict_rule.contract:VERDICT_RULES"
stop_rule = "piloop.plugins.stop_rule.contract:STOP_RULES"
executor = "piloop.plugins.executor.contract:EXECUTORS"
network = "piloop.plugins.network.contract:NETWORKS"
vcs = "piloop.plugins.vcs.contract:VCS"
secrets = "piloop.plugins.secrets.contract:SECRETS"
section = "piloop.plugins.section.contract:SECTIONS"
fact_source = "piloop.plugins.fact_source.contract:FACT_SOURCES"
campaign_type = "piloop.plugins.campaign_type.contract:CAMPAIGN_TYPES"
memory = "piloop.plugins.memory.contract:MEMORY"
archive = "piloop.plugins.archive.contract:ARCHIVES"
harness = "piloop.plugins.harness.contract:HARNESSES"
mcp_server = "piloop.plugins.mcp_server.contract:MCP_SERVERS"

# What runs in the daemon for a capability, or for a provider that needs the daemon, by its name
# (piloop.plugins.contribution.CONTRIBUTORS).
[project.entry-points."piloop.contributors"]
executor = "piloop.plugins.executor.consumers:contribution"
fact_source = "piloop.plugins.fact_source.consumers:contribution"
optimization = "piloop.plugins.campaign_type.optimization.consumers:contribution"
role = "piloop.plugins.role.consumers:contribution"
campaign_type = "piloop.plugins.campaign_type.consumers:contribution"

[project.entry-points."piloop.runtimes"]
subprocess = "piloop.plugins.runtime.subprocess:Subprocess"

[project.entry-points."piloop.harnesses"]
pi = "piloop.plugins.harness.pi:Pi"
claude = "piloop.plugins.harness.claude:Claude"
codex = "piloop.plugins.harness.codex:Codex"

[project.entry-points."piloop.cas"]
disk = "piloop.plugins.cas.disk:Disk"
cached = "piloop.plugins.cas.cached:Cached"
s3 = "piloop.plugins.cas.s3:S3"
gcs = "piloop.plugins.cas.gcs:Gcs"
http = "piloop.plugins.cas.http:Http"

[project.entry-points."piloop.triggers"]
run_failed = "piloop.plugins.campaign_type.kit.runs.trigger.run_failed:RunFailed"
dead_at_startup = "piloop.plugins.trigger.dead_at_startup:DeadAtStartup"
leaking_funnel = "piloop.plugins.campaign_type.kit.runs.trigger.leaking_funnel:LeakingFunnel"
cron = "piloop.plugins.trigger.cron:CronTrigger"
seed = "piloop.plugins.campaign_type.kit.backlog.trigger.seed:SeedTrigger"
low_water = "piloop.plugins.campaign_type.kit.backlog.trigger.low_water:LowWaterTrigger"
stalled = "piloop.plugins.campaign_type.kit.runs.trigger.stalled:StalledTrigger"
stopped = "piloop.plugins.trigger.stopped:StoppedTrigger"
sql = "piloop.plugins.trigger.sql:SqlTrigger"
news = "piloop.plugins.trigger.news:NewsTrigger"

[project.entry-points."piloop.verdict_rules"]
bootstrap = "piloop.plugins.campaign_type.kit.verdicts.verdict_rule.bootstrap:Bootstrap"

[project.entry-points."piloop.stop_rules"]
limits = "piloop.plugins.stop_rule.limits:Limits"

[project.entry-points."piloop.executors"]
workers = "piloop.plugins.executor.workers:Workers"

[project.entry-points."piloop.networks"]
https = "piloop.plugins.network.https:Https"
proxy = "piloop.plugins.network.proxy:Proxy"

[project.entry-points."piloop.provisioners"]
modal = "piloop.plugins.provisioner.modal:Modal"

[project.entry-points."piloop.vcs"]
git = "piloop.plugins.vcs.git:Git"

[project.entry-points."piloop.secrets"]
local = "piloop.plugins.secrets.local:LocalSecrets"

[project.entry-points."piloop.sections"]
headline = "piloop.plugins.campaign_type.kit.verdicts.section.headline:Headline"
goal = "piloop.plugins.section.goal:Goal"
tracks = "piloop.plugins.campaign_type.kit.verdicts.section.tracks:Tracks"
trajectory = "piloop.plugins.campaign_type.kit.verdicts.section.trajectory:Trajectory"
runs = "piloop.plugins.campaign_type.kit.runs.section.runs:Runs"
queue = "piloop.plugins.campaign_type.kit.backlog.section.queue:Queue"
agents = "piloop.plugins.section.agents:Agents"
evaluations = "piloop.plugins.campaign_type.kit.evaluation.section.evaluations:Evaluations"
funnel = "piloop.plugins.campaign_type.kit.evaluation.section.funnel:RunFunnel"
cost = "piloop.plugins.section.cost:Cost"
candidates = "piloop.plugins.campaign_type.kit.verdicts.section.candidates:Candidates"
idle_queue = "piloop.plugins.campaign_type.kit.backlog.section.idle_queue:IdleQueue"
same_as_parent = "piloop.plugins.campaign_type.kit.verdicts.section.same_as_parent:SameAsParent"
reported = "piloop.plugins.section.reported:Reported"
inbox = "piloop.plugins.section.inbox:Inbox"
events = "piloop.plugins.section.events:Events"
tools = "piloop.plugins.section.tools:Tools"
incidents = "piloop.plugins.section.incidents:Incidents"
pack = "piloop.plugins.campaign_type.kit.runs.section.pack:Pack"
history = "piloop.plugins.campaign_type.kit.runs.section.history:History"
lessons = "piloop.plugins.section.lessons:Lessons"

[project.entry-points."piloop.fact_sources"]
campaign = "piloop.plugins.fact_source.campaign:CampaignFacts"
optimization = "piloop.plugins.campaign_type.optimization.fact_source.optimization:OptimizationFacts"
command = "piloop.plugins.fact_source.command:Command"

[project.entry-points."piloop.campaign_types"]
optimization = "piloop.plugins.campaign_type.optimization:Optimization"

[project.entry-points."piloop.memory"]
local = "piloop.plugins.memory.local:LocalMemory"

[project.entry-points."piloop.archives"]
local = "piloop.plugins.archive.local:LocalArchive"

[project.entry-points."piloop.mcp_servers"]
http = "piloop.plugins.mcp_server.http:HttpServer"
stdio = "piloop.plugins.mcp_server.stdio:StdioServer"

# The tables of each plugin that has its own, by schema name (piloop.db.schema.SCHEMAS); the others are core's.
[project.entry-points."piloop.schemas"]
optimization = "piloop.plugins.campaign_type.optimization.tables:SCHEMA"
"memory/local" = "piloop.plugins.memory.local.tables:SCHEMA"
"archive/local" = "piloop.plugins.archive.local.tables:SCHEMA"

[project.entry-points."piloop.roles"]
implementer = "piloop.plugins.role.implementer:ImplementerRole"
watchdog = "piloop.plugins.campaign_type.kit.runs.role.watchdog:WatchdogRole"
research = "piloop.plugins.campaign_type.kit.backlog.role.research:ResearchRole"
scout = "piloop.plugins.campaign_type.kit.backlog.role.scout:ScoutRole"
orchestrator = "piloop.plugins.role.orchestrator:OrchestratorRole"

[tool.hatch.build.targets.wheel]
packages = ["piloop"]

[tool.hatch.build.targets.wheel.force-include]
# the Agent Skills package at the repo root ships inside the CLI: `piloop install-skills` copies the installed version
"skills" = "piloop/cli/agent_skills"

[tool.uv]
default-groups = ["dev", "lint"]

[project.optional-dependencies]
gcs = ["google-cloud-storage>=3.0"]
modal = ["modal>=1.6"]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.112",
    "coverage[toml]>=7.9",
    "dirty-equals>=0.9",
    "google-cloud-storage>=3.0",
    "inline-snapshot>=0.23",
    "modal>=1.6",
    "moto[s3]>=5.2.4",
    "pytest>=8.4",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.14",
    "pytest-pretty>=1.3",
    "pytest-xdist>=3.8.0",
    "tomli-w>=1.2.0",
]
lint = [
    "pre-commit>=4.2",
    "ruff>=0.12",
    "ty>=0.0.1a",
    "types-psutil>=7.2.2.20260906",
]
# Release-time only, never a dependency of piloop: `make changelog` and the PR title check.
release = ["git-cliff>=2.14.2"]

[tool.ruff]
line-length = 120
target-version = "py314"
include = ["piloop/**/*.py", "tests/**/*.py", "scripts/**/*.py", "examples/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
extend-select = ["Q", "RUF100", "RUF018", "C90", "UP", "I", "D", "PGH003", "B", "SIM", "TID252"]
flake8-quotes = { inline-quotes = "single", multiline-quotes = "double" }
mccabe = { max-complexity = 15 }
ignore = ["D100", "D102", "D104", "D105", "D107"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["piloop"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]
"piloop/**/migrations/**/*.py" = ["D"]
# the re-exports are grouped by capability, not sorted by module
"piloop/capabilities.py" = ["I001"]

[tool.ruff.format]
quote-style = "single"

[tool.ty.environment]
python-version = "3.14"
extra-paths = ["examples/plugins/nice-runtime", "examples/plugins/sqlite-cas", "examples/plugins/min-gain", "examples/plugins/stop-after-keeps", "examples/plugins/keep-cost", "examples/plugins/inline-executor"]

[tool.ty.src]
include = ["piloop", "tests", "scripts", "examples"]
exclude = [
    "piloop/db/migrations/versions",
    "piloop/plugins/*/*/migrations",
    "piloop/campaign/templates",  # projects with their own deps
    "tests/typing",  # wrong on purpose: tests/test_typing.py checks it
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The example plugins import as packages; their entry points register only where a test installs them.
pythonpath = ["examples/plugins/nice-runtime", "examples/plugins/sqlite-cas", "examples/plugins/min-gain", "examples/plugins/stop-after-keeps", "examples/plugins/keep-cost", "examples/plugins/inline-executor"]
# The e2e tests run real agents and cost money: only `make e2e` (`-m e2e`, which overrides this) selects them.
addopts = ["-m", "not e2e"]
markers = [
    "e2e: a real campaign with real agents (make e2e)",
    "needs(*tests): skip unless these earlier tests of the module passed (tests/e2e)",
]
xfail_strict = true
filterwarnings = [
    "error",
]

[tool.coverage.run]
data_file = ".coverage/.coverage"
source = ["piloop"]
omit = ["piloop/db/migrations/*", "piloop/plugins/*/*/migrations/*", "piloop/__main__.py", "piloop/campaign/templates/*"]
branch = true

[tool.coverage.report]
fail_under = 100
skip_covered = true
show_missing = true
precision = 2
exclude_lines = [
    'pragma: no cover',
    'raise NotImplementedError',
    'if TYPE_CHECKING:',
    '@overload',
    'assert_never\(',
    'if __name__ == .__main__.:',
    '^\s*\.\.\.$',
]

[tool.inline-snapshot]
format-command = "ruff format --stdin-filename {filename}"
