[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "piloop"
version = "0.4.0"
description = "Autoresearch for any repo: coding agents try ideas, piloop scores every commit and keeps what wins"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Autoresearch, Inc." }]
keywords = ["autoresearch", "agents", "claude-code", "codex", "optimization", "experiments"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
]
dependencies = [
    "alembic>=1.16",
    "covalence==0.1.0.dev6",
    "boto3>=1.43.112",
    "cyclopts>=3.20",
    "fastapi>=0.161",
    "gitpython>=3.1.45",
    "httpx2>=2.12.0",
    "opentelemetry-exporter-otlp-proto-http>=1.34",
    "opentelemetry-sdk>=1.34",
    "psutil>=7",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.41",
    "textual>=8.2,<9",
    "uvicorn>=0.54",
    "genai-prices>=0.1.13",
]

[project.urls]
Homepage = "https://github.com/hiloopai/piloop"
Documentation = "https://piloop.autoresearch.inc"
Changelog = "https://github.com/hiloopai/piloop/blob/main/CHANGELOG.md"
Issues = "https://github.com/hiloopai/piloop/issues"

[project.scripts]
piloop = "piloop.cli.main:main"

# The commands of piloop itself, which load by their import path when they run (piloop.cli.main.COMMANDS).
[project.entry-points."piloop.commands"]
idea = "piloop.plugins.campaign_type.kit.backlog.cli:app"
candidate = "piloop.plugins.campaign_type.optimization.cli:candidate_app"
measurement = "piloop.plugins.campaign_type.kit.evaluation.cli:measurement_app"
eval = "piloop.plugins.campaign_type.kit.evaluation.cli:eval_app"
store = "piloop.plugins.archive.local.cli:app"
token = "piloop.cli.token:app"
agent = "piloop.cli.agents:agent_app"
run = "piloop.plugins.campaign_type.kit.runs.cli:run_app"
worker = "piloop.plugins.executor.workers.cli:app"
limits = "piloop.cli.limits:app"
cas = "piloop.cli.cas:app"
secret = "piloop.cli.secret:app"
init = "piloop.cli.campaign:init"
history = "piloop.plugins.campaign_type.optimization.cli:history"
watch = "piloop.cli.views:watch"
pause = "piloop.cli.control:pause"
resume = "piloop.cli.control:resume"
restore = "piloop.plugins.archive.local.cli:restore"
launch = "piloop.cli.agents:launch"
prompt = "piloop.cli.agents:prompt"
attach = "piloop.cli.agent_io:attach"
journal = "piloop.plugins.memory.local.cli:journal"
message = "piloop.cli.inbox:message"
escalate = "piloop.cli.inbox:escalate"
wake = "piloop.cli.wake:wake"
serve = "piloop.cli.daemon:serve"
stop = "piloop.cli.daemon:stop"
restart = "piloop.cli.daemon:restart"
service-unit = "piloop.cli.daemon:service_unit_cmd"
sql = "piloop.cli.database:sql_cmd"
schema = "piloop.cli.database:schema"
migrate = "piloop.cli.database:migrate_cmd"
upgrade = "piloop.cli.install:upgrade"
doctor = "piloop.cli.install:doctor_cmd"
plugins = "piloop.cli.plugins:plugins_cmd"
install-skills = "piloop.cli.install:install_skills"

# The providers of piloop itself, in the groups that a plugin package uses (piloop.plugins.host).
[project.entry-points."piloop.capabilities"]
runtime = "piloop.plugins.runtime.contract:RUNTIMES"
cas = "piloop.plugins.cas.contract:CAS"
provisioner = "piloop.plugins.provisioner.contract:PROVISIONERS"
trigger = "piloop.plugins.trigger.contract:TRIGGERS"
role = "piloop.plugins.role.contract:ROLES"
verdict_rule = "piloop.plugins.campaign_type.kit.verdicts.verdict_rule.contract:VERDICT_RULES"
stop_rule = "piloop.plugins.stop_rule.contract:STOP_RULES"
executor = "piloop.plugins.executor.contract:EXECUTORS"
network = "piloop.plugins.network.contract:NETWORKS"
vcs = "piloop.plugins.vcs.contract:VCS"
secrets = "piloop.plugins.secrets.contract:SECRETS"
section = "piloop.plugins.section.contract:SECTIONS"
fact_source = "piloop.plugins.fact_source.contract:FACT_SOURCES"
campaign_type = "piloop.plugins.campaign_type.contract:CAMPAIGN_TYPES"
memory = "piloop.plugins.memory.contract:MEMORY"
archive = "piloop.plugins.archive.contract:ARCHIVES"
harness = "piloop.plugins.harness.contract:HARNESSES"
mcp_server = "piloop.plugins.mcp_server.contract:MCP_SERVERS"
lineage = "piloop.plugins.lineage.contract:LINEAGE"
notifier = "piloop.plugins.notifier.contract:NOTIFIERS"
escalation = "piloop.plugins.escalation.contract:ESCALATIONS"
