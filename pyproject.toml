[tool.hatch.build.targets.wheel]
packages = ["piloop"]

[tool.uv]
default-groups = ["dev", "lint"]

[project.optional-dependencies]
gcs = ["google-cloud-storage>=3.0"]
modal = ["modal>=1.6"]
slack = ["slack-sdk>=3.36"]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.112",
    "coverage[toml]>=7.9",
    "dirty-equals>=0.9",
    "google-cloud-storage>=3.0",
    "inline-snapshot>=0.23",
    "modal>=1.6",
    "slack-sdk>=3.36",
    "moto[s3]>=5.2.4",
    "pytest>=8.4",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.14",
    "pytest-pretty>=1.3",
    "pytest-xdist>=3.8.0",
    "tomli-w>=1.2.0",
]
lint = [
    "pre-commit>=4.2",
    "ruff>=0.12",
    "ty>=0.0.1a",
    "types-psutil>=7.2.2.20260906",
]
# Release-time only, never a dependency of piloop: `make changelog` and the PR title check.
release = ["git-cliff>=2.14.2"]

[tool.ruff]
line-length = 120
target-version = "py314"
include = ["piloop/**/*.py", "tests/**/*.py", "scripts/**/*.py", "examples/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
extend-select = ["Q", "RUF100", "RUF018", "C90", "UP", "I", "D", "PGH003", "B", "SIM", "TID252"]
flake8-quotes = { inline-quotes = "single", multiline-quotes = "double" }
mccabe = { max-complexity = 15 }
ignore = ["D100", "D102", "D104", "D105", "D107"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["piloop"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]
"piloop/**/migrations/**/*.py" = ["D"]
# the re-exports are grouped by capability, not sorted by module
"piloop/capabilities.py" = ["I001"]

[tool.ruff.format]
quote-style = "single"

[tool.ty.environment]
python-version = "3.14"
extra-paths = ["examples/plugins/nice-runtime", "examples/plugins/sqlite-cas", "examples/plugins/min-gain", "examples/plugins/stop-after-keeps", "examples/plugins/keep-cost", "examples/plugins/inline-executor", "examples/plugins/inference"]

[tool.ty.src]
include = ["piloop", "tests", "scripts", "examples"]
exclude = [
    "piloop/db/migrations/versions",
    "piloop/plugins/*/*/migrations",
    "piloop/plugins/campaign_type/optimization/templates",  # projects with their own deps
    "tests/typing",  # wrong on purpose: tests/test_typing.py checks it
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The example plugins import as packages; their entry points register only where a test installs them.
pythonpath = ["examples/plugins/nice-runtime", "examples/plugins/sqlite-cas", "examples/plugins/min-gain", "examples/plugins/stop-after-keeps", "examples/plugins/keep-cost", "examples/plugins/inline-executor", "examples/plugins/inference"]
# The e2e tests run real agents and cost money: only `make e2e` (`-m e2e`, which overrides this) selects them.
# A quarantined test runs only in `make quarantine` (`-m quarantine`), until its issue is fixed.
addopts = ["-m", "not e2e and not quarantine", "-p", "tests.shard"]
markers = [
    "e2e: a real campaign with real agents (make e2e)",
    "quarantine(issue): a flaky test, out of the required run until its open issue (tests/quarantine.toml) is fixed",
    "needs(*tests): skip unless these earlier tests of the module passed (tests/e2e)",
]
xfail_strict = true
# A test that runs this long prints every thread's stack, so a hang names its test before the job times out.
faulthandler_timeout = 120
filterwarnings = [
    "error",
]

[tool.coverage.run]
data_file = ".coverage/.coverage"
source = ["piloop"]
omit = ["piloop/db/migrations/*", "piloop/plugins/*/*/migrations/*", "piloop/__main__.py", "piloop/plugins/campaign_type/optimization/templates/*"]
branch = true
plugins = ["tests.quarantine"]

[tool.coverage.report]
fail_under = 100
skip_covered = true
show_missing = true
precision = 2
exclude_lines = [
    'pragma: no cover',
    'raise NotImplementedError',
    'if TYPE_CHECKING:',
    '@overload',
    'assert_never\(',
    'if __name__ == .__main__.:',
    '^\s*\.\.\.$',
]

[tool.inline-snapshot]
format-command = "ruff format --stdin-filename {filename}"
