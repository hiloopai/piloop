launch_policy = "piloop.plugins.launch_policy.contract:LAUNCH_POLICIES"
harness_choice = "piloop.plugins.harness_choice.contract:HARNESS_CHOICES"

# What runs in the daemon for a capability, or for a provider that needs the daemon, by its name
# (piloop.plugins.contribution.CONTRIBUTORS).
[project.entry-points."piloop.contributors"]
executor = "piloop.plugins.executor.consumers:contribution"
fact_source = "piloop.plugins.fact_source.consumers:contribution"
optimization = "piloop.plugins.campaign_type.optimization.consumers:contribution"
role = "piloop.plugins.role.consumers:contribution"
campaign_type = "piloop.plugins.campaign_type.consumers:contribution"
notifier = "piloop.plugins.notifier.consumers:contribution"

[project.entry-points."piloop.runtimes"]
