# piloop on Claude Code: one worker with a fresh session per run, no lead, research or watchdog. Round 4 control.
kind = "piloop"
name = "c-1w"
piloop = "piloop[modal] @ git+https://github.com/hiloopai/piloop@9e009a9ab82feca14552d430a9ab0bc24c18ce0a"
agents = [{ harness = "claude", model = "claude-opus-5-5" }]
split = "sealed"

[overlay.evaluator]
scoring = "submit"
noise_runs = 3

[overlay.plugins.role.orchestrator]
triggers = []

[overlay.plugins.role.research]
triggers = []

[overlay.plugins.role.watchdog]
triggers = []

[overlay.plugins.role.implementer]
max_concurrent = 1
timeout = 3600
effort = "medium"
