# piloop v0: four workers that claim their ideas and submit, an always-on lead, and a sealed split of the campaign's
# own. `piloop` names the commit of main under test.
kind = "piloop"
name = "piloop-v0"
piloop = "piloop[modal] @ git+https://github.com/hiloopai/piloop@05fcf7de9ec218246640f10c03eda6c38c03af05"
agents = [
    { harness = "codex", model = "gpt-6-astra" },
    { harness = "claude", model = "claude-opus-5-5" },
]
split = "sealed"
resources = { cpu = 8, memory_mb = 16384 }

[overlay.evaluator]
scoring = "submit"
submissions = 3
noise_runs = 3

[overlay.plugins.verdict_rule]
provider = "noise"
m = 2

[overlay.plugins.role.implementer]
max_concurrent = 4
timeout = 3600                           # one hour per run, a fresh session per idea

# The lead: seeds and refills the board, triages escalations, steers running workers, prunes.
[overlay.plugins.role.orchestrator]
harnesses = ["codex"]
triggers = ["news", "low_water", "stalled", "run_failed", "cron"]
interval = 900
max_ideas = 4
timeout = 3600

[overlay.plugins.role.research]
triggers = []

[overlay.plugins.role.watchdog]
triggers = []

[overlay.plugins.fact_source]
use = ["campaign", "optimization", "models", "spend"]

[overlay.plugins.fact_source.spend]
facts = ["models_usd"]

[overlay.plugins.stop_rule]
plateau = 12                             # three rounds of four runs without a keep
hold_at = { spend = 60 }                 # the pilot's budget; the driver also stops every arm there
