# The control: piloop 0.5.0's defaults, from PyPI, with Codex and Claude workers in rotation.
kind = "piloop"
name = "piloop-0.5.0"
piloop = "piloop[modal]==0.5.0"
agents = [
    { harness = "codex", model = "gpt-6-astra" },
    { harness = "claude", model = "claude-opus-5-5" },
]
resources = { cpu = 8, memory_mb = 16384 }
