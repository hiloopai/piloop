# The pool model (piloop 0.6): 1 identical Codex worker(s), no lead. The same as the worker-curve bench's wc-1w, at
# the commit that replaced verdicts with a scored pool (#681), plus the provisioners that the driver needs and two
# fixes: a 0.5 stored config loads (#687), and staging an agent's workspace leaks no file descriptor (#702). piloop
# changed only in those between the two.
kind = "piloop"
name = "pool-1w"
piloop = "piloop[modal,daytona] @ git+https://github.com/hiloopai/piloop@b0c930b704a24559bdf7b00cdfc9c5d0d616fb24"
agents = [{ harness = "codex", model = "gpt-6.1-sol" }]
split = "sealed"

[overlay.evaluator]
noise_runs = 3

[overlay.plugins.role.implementer]
max_concurrent = 1
timeout = 3600
effort = "high"
