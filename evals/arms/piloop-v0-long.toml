# piloop v0 with one long worker: it keeps its session across runs (continuity resume) for the whole budget, and a
# lean lead. `piloop` names the commit of main under test.
kind = "piloop"
name = "piloop-v0-long"
piloop = "piloop[modal] @ git+https://github.com/hiloopai/piloop@187600116174236e096c676ed569e368ba708904"
agents = [
    { harness = "codex", model = "gpt-6.1-sol" },
    # { harness = "claude", model = "claude-opus-5-5" },  # back in once the model gateway serves Claude
]
split = "sealed"
resources = { cpu = 8, memory_mb = 16384, gpus = 2 }   # gpus: on a GPU task, two, so dev runs don't queue behind the daemon's evaluations

[overlay.evaluator]
scoring = "submit"
submissions = 1000
noise_runs = 3

[overlay.plugins.verdict_rule]
provider = "noise"
m = 2

[overlay.plugins.role.implementer]
max_concurrent = 1
timeout = 14400                          # the whole budget
continuity = "resume"                    # each run resumes the last run's session

# The lean lead: it runs only on news (escalations and messages) and failed runs. Workers propose their own ideas.
[overlay.plugins.role.orchestrator]
harnesses = ["codex"]
triggers = ["news", "run_failed"]
max_ideas = 4

[overlay.plugins.role.research]
triggers = []

[overlay.plugins.role.watchdog]
triggers = []

[overlay.plugins.fact_source]
use = ["campaign", "optimization", "models", "spend"]

[overlay.plugins.fact_source.spend]
facts = ["models_usd"]

[overlay.plugins.stop_rule]
plateau = 12                             # three rounds of four runs without a keep
hold_at = { spend = 60 }                 # the pilot's budget; the driver also stops every arm there
