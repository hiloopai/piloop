# piloop on Claude Code: two workers in lineage (a keep tells the other to merge the head) with the same brief, no
# lead. The control for c-charters-2.
kind = "piloop"
name = "c-identical-2"
piloop = "piloop[modal] @ git+https://github.com/hiloopai/piloop@9e009a9ab82feca14552d430a9ab0bc24c18ce0a"
agents = [{ harness = "claude", model = "claude-opus-5-5" }]
split = "sealed"

[overlay.evaluator]
scoring = "submit"
noise_runs = 3

[overlay.plugins.verdict_rule]
provider = "noise"
m = 2

[overlay.plugins.role.orchestrator]
triggers = []

[overlay.plugins.role.research]
triggers = []

[overlay.plugins.role.watchdog]
triggers = []

[overlay.plugins.role.implementer]
max_concurrent = 2
follow_head = "message"
timeout = 3600
effort = "medium"
