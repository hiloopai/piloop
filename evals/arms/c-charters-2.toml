# piloop on Claude Code: two workers in lineage, each in its own run role with a charter: the part of the program it
# owns. No lead. `implementer` holds charter a, `implementer_b` charter b.
kind = "piloop"
name = "c-charters-2"
piloop = "piloop[modal] @ git+https://github.com/hiloopai/piloop@9e009a9ab82feca14552d430a9ab0bc24c18ce0a"
agents = [{ harness = "claude", model = "claude-opus-5-5" }]
split = "sealed"
resources = { cpu = 8, memory_mb = 16384, gpus = 2 }

[overlay.evaluator]
scoring = "submit"
noise_runs = 3

[overlay.plugins.verdict_rule]
provider = "noise"
m = 2

[overlay.plugins.role.orchestrator]
triggers = []

[overlay.plugins.role.research]
triggers = []

[overlay.plugins.role.watchdog]
triggers = []

[overlay.plugins.role.implementer]
max_concurrent = 1
follow_head = "message"
timeout = 3600
effort = "medium"

[overlay.plugins.role.implementer_b]
runs = true
max_concurrent = 1
follow_head = "message"
timeout = 3600
effort = "medium"

[charters.t5-lpaq]
implementer = "You own the context model and mixing: new contexts, the mixer and SSE. Another worker owns everything around the model: preprocessing and transforms of the input, the dictionary, and the coder and I/O path. Work only on your part. Read its notes with `piloop history` before each new idea, and post as a note anything it could use."
implementer_b = "You own everything around the model: preprocessing and transforms of the input, the dictionary, and the coder and I/O path. Another worker owns the context model and mixing: new contexts, the mixer and SSE. Work only on your part. Read its notes with `piloop history` before each new idea, and post as a note anything it could use."

[charters.t4-1brc]
implementer = "You own parsing and I/O: reading the file, splitting it, number parsing and threads. Another worker owns aggregation: the hash table, name hashing and storage, merging and output. Work only on your part. Read its notes with `piloop history` before each new idea, and post as a note anything it could use."
implementer_b = "You own aggregation: the hash table, name hashing and storage, merging and output. Another worker owns parsing and I/O: reading the file, splitting it, number parsing and threads. Work only on your part. Read its notes with `piloop history` before each new idea, and post as a note anything it could use."
