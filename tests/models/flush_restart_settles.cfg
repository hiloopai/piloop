\* Mutant: a restart settles the claims of the run that it fails at once, while a submission waits (the code before the fix). NoDoubleRun fails.
CONSTANTS Slots = 2  Periods = 2  Ideas = {1, 2, 3}  MaxRuns = 3
MANY = TRUE  BY_SUBMISSIONS = TRUE  TIMEOUT_FINISHES = TRUE  SETTLE_WAITS = TRUE  SUBMIT_NEEDS_CLAIM = TRUE  BASE_MOVES = TRUE  STOPS = TRUE  RESTARTS = TRUE  RESTART_WAITS = FALSE
SPECIFICATION Spec
INVARIANT NoIdeaLost
INVARIANT NoDoubleRun
INVARIANT NoSubmissionLost
INVARIANT ScoredNotRedone
INVARIANT BaseIsBest
INVARIANT RunsBound
PROPERTY PeriodsEnd
PROPERTY ClaimsSettle
PROPERTY SubmissionsScored
