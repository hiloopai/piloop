MANY = FALSE  BY_SUBMISSIONS = FALSE  TIMEOUT_FINISHES = TRUE  SETTLE_WAITS = TRUE  SUBMIT_NEEDS_CLAIM = TRUE  BASE_MOVES = TRUE  STOPS = TRUE  RESTARTS = FALSE  RESTART_WAITS = TRUE
SPECIFICATION Spec
INVARIANT NoIdeaLost
INVARIANT NoDoubleRun
INVARIANT NoSubmissionLost
INVARIANT ScoredNotRedone
INVARIANT BaseIsBest
INVARIANT RunsBound
PROPERTY PeriodsEnd
PROPERTY ClaimsSettle
PROPERTY SubmissionsScored
