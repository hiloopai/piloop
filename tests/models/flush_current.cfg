\* Before run_claims: one claim a run, settled by the run end, and a timed-out run reopens its idea. ScoredNotRedone fails at a timeout (no stop and no restart here).
CONSTANTS Slots = 2  Periods = 2  Ideas = {1, 2, 3}  MaxRuns = 3
MANY = FALSE  BY_SUBMISSIONS = FALSE  TIMEOUT_FINISHES = FALSE  SETTLE_WAITS = TRUE  SUBMIT_NEEDS_CLAIM = TRUE  BASE_MOVES = TRUE  STOPS = FALSE  RESTARTS = FALSE  RESTART_WAITS = TRUE
SPECIFICATION Spec
INVARIANT NoIdeaLost
INVARIANT NoDoubleRun
INVARIANT NoSubmissionLost
INVARIANT ScoredNotRedone
INVARIANT BaseIsBest
INVARIANT RunsBound
PROPERTY PeriodsEnd
PROPERTY ClaimsSettle
PROPERTY SubmissionsScored
