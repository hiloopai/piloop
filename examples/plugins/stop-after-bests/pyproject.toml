[project]
name = "piloop-stop-after-bests"
version = "0.1.0"
description = "A piloop stop rule that ends a campaign after a number of new bests, or at the first limit of the built-in rule"
requires-python = ">=3.14"
dependencies = ["piloop"]

[project.entry-points."piloop.stop_rules"]
after_bests = "piloop_stop_after_bests:AfterBests"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
