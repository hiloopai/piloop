# Keeps main identical in piloop and its private mirror piloop-dev within this organization, in both directions.
# Experimental branches live only in piloop-dev; merging one into main publishes it. A diverged main fails, never forces.
name: Sync main

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sync-main

jobs:
  sync:
    if: >-
      github.repository_owner_id == '291932505' &&
      contains(fromJSON('["1416093684", "1416293099"]'), github.repository_id)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          DEPLOY_KEY: ${{ secrets.SYNC_DEPLOY_KEY }}
          TARGET: ${{ format('{0}/{1}', github.repository_owner, github.repository_id == '1416093684' && 'piloop-dev' || 'piloop') }}
          SSH_AUTH_SOCK: /tmp/ssh-agent.sock
        run: |
          ssh-agent -a "$SSH_AUTH_SOCK" > /dev/null
          ssh-add - <<< "$DEPLOY_KEY"
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git push "git@github.com:$TARGET.git" HEAD:refs/heads/main
