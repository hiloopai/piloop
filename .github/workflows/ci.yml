name: CI

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_call: {}

env:
  COLUMNS: 150
  UV_FROZEN: "1"
  UV_PYTHON_PREFERENCE: only-managed

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
          cache-suffix: lint
      - run: uv sync
      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files --verbose
        env:
          SKIP: no-commit-to-branch
          UV_NO_SYNC: "1"

  test:
    name: test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            make: testcov
          # Coverage is measured on Linux: a few paths (the lock holder from /proc/locks) exist only there.
          - os: macos-latest
            make: test
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
          cache-suffix: test
      - run: uv sync
      - run: make ${{ matrix.make }}

  install:
    name: install.sh quickstart
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: git config --global user.name piloop-ci && git config --global user.email ci@piloop
      - run: PILOOP_SRC=. ./install.sh
      - name: enwik8 example, headless (no Herdr on a runner)
        env:
          PILOOP_PROJECT_RUNTIME: subprocess
          COLUMNS: 200
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          piloop init --example enwik8 /tmp/enwik8 | tee /tmp/init.txt
          grep -q "registered; baseline candidate#1" /tmp/init.txt
          piloop status enwik8
      - name: the wheel carries the skills (a stand-in codex on PATH)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p /tmp/bin && printf '#!/bin/sh\n' > /tmp/bin/codex && chmod +x /tmp/bin/codex
          PATH="/tmp/bin:$PATH" piloop install-skills
          test -f ~/.agents/skills/piloop-operate/SKILL.md

  check:
    if: always()
    needs: [lint, test, install]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
