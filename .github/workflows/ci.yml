name: CI

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_call: {}
  workflow_dispatch: {}
  schedule:
    - cron: '23 6 * * *'

env:
  COLUMNS: 150
  UV_FROZEN: "1"
  UV_PYTHON_PREFERENCE: only-managed

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint and install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENWIK8_SHA256: 547994d9980ebed1288380d652999f38a14fe291a6247c157c3d33d4932534bc
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
          cache-suffix: lint
      - run: uv sync
      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files --verbose
        env:
          SKIP: no-commit-to-branch
          UV_NO_SYNC: "1"
      - run: git config --global user.name piloop-ci && git config --global user.email ci@piloop
      - run: PILOOP_SRC=. ./install.sh
      # The examples' data host sometimes serves a corrupt archive: CI downloads it only on a cache miss, checked.
      # `piloop init` skips a data file that is already in place.
      - uses: actions/cache@v6
        id: enwik8
        with:
          path: /tmp/enwik8.zip
          key: enwik8-zip-${{ env.ENWIK8_SHA256 }}
      - name: download enwik8 until its checksum matches
        if: steps.enwik8.outputs.cache-hit != 'true'
        run: |
          for attempt in 1 2 3 4 5; do
            curl -fsSL --retry 3 -o /tmp/enwik8.zip https://mattmahoney.net/dc/enwik8.zip &&
              echo "$ENWIK8_SHA256  /tmp/enwik8.zip" | sha256sum -c - && exit 0
            sleep $((attempt * 10))
          done
          exit 1
      - name: enwik8 example, headless
        env:
          PILOOP_CAMPAIGN_RUNTIME: subprocess
          COLUMNS: 200
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p /tmp/enwik8/data && cp /tmp/enwik8.zip /tmp/enwik8/data/
          piloop init --example enwik8 /tmp/enwik8 | tee /tmp/init.txt
          grep -q "^baseline candidate#1: bytes" /tmp/init.txt
          piloop status enwik8
          piloop stop
      - name: the example plugins install next to piloop and are selected through the configuration
        env:
          PILOOP_HOME: /tmp/plugins-home
          PILOOP_CAMPAIGN_RUNTIME: nice
          PILOOP_CAMPAIGN_PLUGINS__VERDICT_RULE__PROVIDER: min_gain
          PILOOP_CAMPAIGN_PLUGINS__VERDICT_RULE__MIN_GAIN: "100"
          PILOOP_CAMPAIGN_PLUGINS__STOP_RULE__PROVIDER: after_keeps
          PILOOP_CAMPAIGN_PLUGINS__STOP_RULE__KEEPS: "3"
          COLUMNS: 200
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv tool install --force --from . piloop $(printf -- '--with ./%s ' examples/plugins/*/)
          mkdir -p -m 700 "$PILOOP_HOME" && printf '[plugins.cas]\nprovider = "sqlite"\npath = "/tmp/plugins-blobs.sqlite"\n' > "$PILOOP_HOME/config.toml"
          piloop serve --check
          mkdir -p /tmp/enwik8-nice/data && cp /tmp/enwik8.zip /tmp/enwik8-nice/data/
          piloop init --example enwik8 /tmp/enwik8-nice
          piloop plugins | tee /tmp/plugins.txt
          grep -q "nice        piloop-nice 0.1.0, entry point nice = piloop_nice:Nice$" /tmp/plugins.txt
          grep -q "enwik8: runtime nice, from piloop-nice 0.1.0" /tmp/plugins.txt
          grep -q "CAS provider sqlite, from piloop-sqlite-cas 0.1.0" /tmp/plugins.txt
          grep -q "enwik8: verdict rule min_gain, from piloop-min-gain 0.1.0" /tmp/plugins.txt
          grep -q "enwik8: stop rule after_keeps, from piloop-stop-after-keeps 0.1.0" /tmp/plugins.txt
      - name: the wheel carries the skills (a stand-in codex on PATH)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p /tmp/bin && printf '#!/bin/sh\n' > /tmp/bin/codex && chmod +x /tmp/bin/codex
          PATH="/tmp/bin:$PATH" piloop install-skills
          test -f ~/.agents/skills/piloop-operate/SKILL.md

  test:
    name: test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        exclude:
          # macOS minutes are scarce in the private mirror: there it runs nightly, on demand and on release PRs only.
          - os: ${{ (github.repository == 'hiloopai/piloop' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release-')) && 'none' || 'macos-latest' }}
        include:
          - os: ubuntu-latest
            make: testcov
            # Two vCPUs; the tests wait on subprocesses, so four pytest workers finish sooner than two.
            workers: 4
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
          cache-suffix: test
      - run: uv sync
      - run: make ${{ matrix.make || 'test' }} PYTEST_WORKERS=${{ matrix.workers || 'logical' }}

  # Not in `check`: a quarantined test fails here without failing CI. It runs on every push, so its fix shows as a
  # run of passes.
  quarantine:
    name: quarantined tests (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
          cache-suffix: test
      - run: uv sync
      - name: each quarantine issue is still open
        # The issues live in the private repository.
        if: github.event.repository.private
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(grep -o '^\[[0-9]\+\]' tests/quarantine.toml | tr -d '[]'); do
            state=$(gh issue view "$n" -R "$GITHUB_REPOSITORY" --json state -q .state)
            [ "$state" = OPEN ] || { echo "::error::issue $n is $state: delete its table in tests/quarantine.toml and its marks"; exit 1; }
          done
      - run: make quarantine PYTEST_WORKERS=4

  check:
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
