name: CI

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_call: {}
  workflow_dispatch: {}
  schedule:
    - cron: '23 6 * * *'

env:
  COLUMNS: 150
  UV_FROZEN: "1"
  UV_PYTHON_PREFERENCE: only-managed

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint and install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENWIK8_SHA256: 547994d9980ebed1288380d652999f38a14fe291a6247c157c3d33d4932534bc
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
          cache-suffix: lint
      - run: uv sync
      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files --verbose
        env:
          SKIP: no-commit-to-branch
          UV_NO_SYNC: "1"
      - run: git config --global user.name piloop-ci && git config --global user.email ci@piloop
      - run: PILOOP_SRC=. ./install.sh
      # The examples' data host sometimes serves a corrupt archive: CI downloads it only on a cache miss, checked.
      # `piloop init` skips a data file that is already in place.
      - uses: actions/cache@v6
        id: enwik8
        with:
          path: /tmp/enwik8.zip
          key: enwik8-zip-${{ env.ENWIK8_SHA256 }}
      - name: download enwik8 until its checksum matches
        if: steps.enwik8.outputs.cache-hit != 'true'
        run: |
          for attempt in 1 2 3 4 5; do
            curl -fsSL --retry 3 -o /tmp/enwik8.zip https://mattmahoney.net/dc/enwik8.zip &&
              echo "$ENWIK8_SHA256  /tmp/enwik8.zip" | sha256sum -c - && exit 0
            sleep $((attempt * 10))
          done
          exit 1
      - name: enwik8 example, headless
        env:
          PILOOP_CAMPAIGN_PLUGINS__RUNTIME__USE: subprocess
          COLUMNS: 200
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p /tmp/enwik8/data && cp /tmp/enwik8.zip /tmp/enwik8/data/
          piloop init --example enwik8 /tmp/enwik8 | tee /tmp/init.txt
          grep -q "^baseline candidate#1: bytes" /tmp/init.txt
          piloop status enwik8
          piloop stop
      - name: the example plugins install next to piloop and are selected through the configuration
        env:
          PILOOP_HOME: /tmp/plugins-home
          PILOOP_CAMPAIGN_PLUGINS__RUNTIME__USE: nice
          PILOOP_CAMPAIGN_PLUGINS__VERDICT_RULE__PROVIDER: min_gain
          PILOOP_CAMPAIGN_PLUGINS__VERDICT_RULE__MIN_GAIN: "100"
          PILOOP_CAMPAIGN_PLUGINS__STOP_RULE__PROVIDER: after_keeps
          PILOOP_CAMPAIGN_PLUGINS__STOP_RULE__KEEPS: "3"
          COLUMNS: 200
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv tool install --force --from . piloop $(printf -- '--with ./%s ' examples/plugins/*/)
          mkdir -p -m 700 "$PILOOP_HOME" && printf '[plugins.cas]\nprovider = "sqlite"\npath = "/tmp/plugins-blobs.sqlite"\n' > "$PILOOP_HOME/config.toml"
          piloop serve --check
          mkdir -p /tmp/enwik8-nice/data && cp /tmp/enwik8.zip /tmp/enwik8-nice/data/
          piloop init --example enwik8 /tmp/enwik8-nice
          piloop plugins | tee /tmp/plugins.txt
          grep -q "nice        piloop-nice 0.1.0, entry point nice = piloop_nice:Nice$" /tmp/plugins.txt
          grep -q "enwik8: runtime nice, from piloop-nice 0.1.0" /tmp/plugins.txt
          grep -q "CAS provider sqlite, from piloop-sqlite-cas 0.1.0" /tmp/plugins.txt
          grep -q "enwik8: verdict rule min_gain, from piloop-min-gain 0.1.0" /tmp/plugins.txt
          grep -q "enwik8: stop rule after_keeps, from piloop-stop-after-keeps 0.1.0" /tmp/plugins.txt
      - name: the wheel carries the skills (a stand-in codex on PATH)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p /tmp/bin && printf '#!/bin/sh\n' > /tmp/bin/codex && chmod +x /tmp/bin/codex
          PATH="/tmp/bin:$PATH" piloop install-skills
          test -f ~/.agents/skills/piloop-operate/SKILL.md

  # Which tests run. A pull request with another stacked on it runs none: the top of the stack runs them for the whole
  # stack. A pull request into the default branch that changes only docs runs none. Anything else runs the whole suite;
  # the nightly and manual runs also record which test covers which line, for the test map (scripts/test_map.py).
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mode: ${{ steps.select.outputs.mode }}
    steps:
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DOCS: '^(docs/|[^/]+\.md$|(.+/)?README\.md$|LICENSE$)'
        run: |
          mode=full
          if [ "$GITHUB_EVENT_NAME" = schedule ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            mode=map
          elif [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if [ -n "$(gh pr list -R "$GITHUB_REPOSITORY" --base "$HEAD_REF" --state open --json number --jq '.[]')" ]; then
              mode=stacked
            elif [ "$BASE_REF" = "$DEFAULT_BRANCH" ] && files=$(gh pr diff "$NUMBER" -R "$GITHUB_REPOSITORY" --name-only) &&
              ! grep -qvE "$DOCS" <<< "$files"; then
              mode=docs
            fi
          fi
          echo "::notice::tests: $mode"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  # The suite is CPU-bound on a runner's two vCPUs, so it is split over eight runners by a hash of each test's id
  # (tests/shard.py). Each part runs four workers, as the tests also wait on subprocesses. `coverage` adds up their data.
  test:
    name: test, part ${{ matrix.shard }} of 8
    needs: select
    if: needs.select.outputs.mode == 'full' || needs.select.outputs.mode == 'map'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
          cache-suffix: test
      - run: uv sync
      # Test contexts need coverage's ctrace core; the other runs keep the faster default.
      - env:
          MAP: ${{ needs.select.outputs.mode == 'map' && '--cov-context=test' || '' }}
        run: |
          [ -z "$MAP" ] || export COVERAGE_CORE=ctrace
          uv run pytest -n 4 --shard ${{ matrix.shard }}/8 --durations=10 --cov --cov-report= --cov-fail-under=0 $MAP
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.shard }}
          path: .coverage/.coverage
          include-hidden-files: true
          retention-days: 1

  # The merge script requires this job: it passes on the whole suite at 100% coverage, or on a docs-only change.
  coverage:
    runs-on: ubuntu-latest
    needs: [select, test]
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.select.outputs.mode == 'docs') }}
    steps:
      - if: needs.select.outputs.mode == 'docs'
        run: echo "docs only, no tests to measure"
      - uses: actions/checkout@v7
        if: needs.select.outputs.mode != 'docs'
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        if: needs.select.outputs.mode != 'docs'
        with:
          python-version: "3.14"
          enable-cache: true
          cache-suffix: test
      - if: needs.select.outputs.mode != 'docs'
        run: uv sync
      - uses: actions/download-artifact@v8
        if: needs.select.outputs.mode != 'docs'
        with:
          pattern: coverage-*
          path: parts
      - if: needs.select.outputs.mode != 'docs'
        run: uv run coverage combine parts/*/.coverage
      - if: needs.select.outputs.mode != 'docs'
        run: uv run coverage report
      - if: needs.select.outputs.mode == 'map'
        run: uv run -m scripts.test_map build .coverage/.coverage --map test-map.json.gz
      - uses: actions/cache/save@v6
        if: needs.select.outputs.mode == 'map' && github.ref == 'refs/heads/main'
        with:
          path: test-map.json.gz
          key: test-map-${{ github.run_id }}
      - uses: actions/upload-artifact@v7
        if: needs.select.outputs.mode == 'map'
        with:
          name: test-map
          path: test-map.json.gz
          retention-days: 7

  # macOS minutes are scarce in the private mirror: there it runs nightly, on demand and on release PRs only.
  macos:
    name: test on macos-latest
    if: github.repository == 'hiloopai/piloop' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release-')
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
          cache-suffix: test
      - run: uv sync
      - run: make test PYTEST_WORKERS=logical

  # Not in `check`: a quarantined test fails here without failing CI. It runs on every push, so its fix shows as a
  # run of passes.
  quarantine:
    name: quarantined tests (non-blocking)
    needs: select
    if: needs.select.outputs.mode == 'full' || needs.select.outputs.mode == 'map'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
          cache-suffix: test
      - run: uv sync
      - name: each quarantine issue is still open
        # The issues live in the private repository.
        if: github.event.repository.private
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(grep -o '^\[[0-9]\+\]' tests/quarantine.toml | tr -d '[]'); do
            state=$(gh issue view "$n" -R "$GITHUB_REPOSITORY" --json state -q .state)
            [ "$state" = OPEN ] || { echo "::error::issue $n is $state: delete its table in tests/quarantine.toml and its marks"; exit 1; }
          done
      - run: make quarantine PYTEST_WORKERS=4

  check:
    if: always()
    needs: [lint, select, test, coverage, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          allowed-skips: test, coverage, macos
          jobs: ${{ toJSON(needs) }}
