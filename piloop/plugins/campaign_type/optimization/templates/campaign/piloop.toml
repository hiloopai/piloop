# piloop campaign config. This file lists every key. A key that is set shows its default, unless its comment says
# otherwise. A commented key or table is optional, and its default is to leave it out.
# Reference: https://piloop.autoresearch.inc/reference/configuration
# `piloop init` stores this file, and the daemon uses that copy: run `piloop init` again after each edit.
# PILOOP_CAMPAIGN_<KEY> overrides a key when `piloop init` reads the file. Join nested keys with __.

name = "my-campaign"                       # required; short identifier; piloop names git refs after it
evaluate = ["uv", "run", "python", "evaluate.py"]  # required; run in a clean checkout of each version; writes {"metrics": …} to $PILOOP_RESULT_FILE
evaluate_timeout = 600                    # seconds; a slower evaluation is stopped and recorded as a crash
link = []                                 # gitignored paths put into every worktree read-only, for example "data" or ".venv"
context = []                              # analysis files that every sweep reads first, for example ["docs/error-analysis.md"]

[plugins.runtime]                         # a capability's own settings are in its table, next to its instances
use = "subprocess"                        # a [plugins.runtime.<name>] of config.toml; subprocess: a background process per agent

[plugins.harness]
use = ["pi", "claude", "codex"]           # not the default, which is ["pi"]; runs use these in turn, unless an idea names one

[plugins.harness.pi]                      # a harness: a built-in one (pi, claude, codex) over its defaults, or a new name
model = "anthropic/claude-opus-5-5"       # required for a harness in a rotation, in that harness's own naming
# max_concurrent = 2                      # the most agents of this harness at the same time, all roles together

[plugins.harness.claude]
model = "claude-opus-5-5"
# env = { ANTHROPIC_BASE_URL = "https://gw.example.com", ANTHROPIC_API_KEY = { secret = "ANTHROPIC_API_KEY" } }
#                                         # more variables of its agents: a value, or a secret (`piloop secret set`)
# user_config = "ignore"                  # "load" gives its agents your own CLAUDE.md, skills, plugins and hooks

[plugins.harness.codex]
model = "gpt-6.1-sol"
# config = { model_provider = "gateway", model_providers.gateway = { name = "gateway", base_url = "https://gw.example.com/v1", env_key = "GATEWAY_KEY", wire_api = "responses" } }
#                                         # keys of Codex's config.toml, as -c flags: here a gateway

# [plugins.harness.<name>]                # a harness of your own
# provider = "claude"                     # that harness over its defaults; without it, the argv only
# executable = "my-agent"                 # keys: executable, headless, resume, session_id_pattern,
# headless = ["--model", "{model}", "{prompt}"]  # home, session_env; see the reference

# [plugins.mcp_server.exa]                # an MCP server that a role can list in its `mcp` key; see the MCP servers guide
# provider = "http"                       # a streamable HTTP server (keys: url, headers_env, bearer_token_env)
# url = "https://mcp.exa.ai/mcp"
# headers_env = { "x-api-key" = "EXA_API_KEY" }  # the header gets the value of this variable from the daemon's environment

# [plugins.mcp_server.xai]
# provider = "stdio"                      # a server that the harness starts (keys: command, env)
# command = ["python3", "server.py"]
# env = ["XAI_API_KEY"]                   # the variables that a stdio server reads

[plugins.role.implementer]                # an implementer tries one idea in a new worktree; its commits are scored
runs = true                               # its agents do runs; a sweeping role has runs = false
# takes = "priority < 3"                  # the ideas it takes: an SQL condition on the ideas table; if not set: every one
# harnesses = ["pi", "claude", "codex"]   # if not set: [plugins.harness] use
# model = { pi = "..." }                  # over the model of each [plugins.harness.<name>]
# effort = "high"                         # how hard its agents think, as the harness names it
# addendum = "briefs/implementer.md"           # a file appended to brief.md in this role's briefs only
# mcp = ["exa"]                           # the [plugins.mcp_server.<name>] servers that this role's agents get; none by default
# prompt = "briefs/my-implementer.md"          # a file that replaces the built-in start of this role's brief
# runtime = "subprocess"                  # if not set: [plugins.runtime] use
# writes = ["commits"]                    # what the brief says the role may write; default: what piloop expects of it
# files = "nothing"                       # what its agents may file with `piloop idea`: nothing, seeds or ideas
# sections = ["lessons", "goal", …]      # names of [plugins.section.<name>]; if not set: the installed sections of its briefs
timeout = 1800                            # seconds one implementer may run
max_concurrent = 4                        # the most runs at the same time, on all workers together
explore_every = 4                         # at least 1 run in 4 starts from a pinned idea, when one is ready; 0 = off
recovery_requeues = 2                     # times an idea is requeued from the last commit of a failed implementer
idle_alert = 1800                         # seconds free slots wait behind proposed ideas before an escalation; 0 = off

[plugins.role.watchdog]                   # a watchdog investigates anomalies and reviews progress every `interval` seconds
# harnesses = ["pi", "claude", "codex"]   # if not set: [plugins.harness] use
# model = { pi = "..." }                  # over the model of each [plugins.harness.<name>]
# effort = "high"                         # how hard its agents think, as the harness names it
# addendum = "briefs/watchdog.md"         # a file appended to brief.md in this role's briefs only
# mcp = []                                # the [plugins.mcp_server.<name>] servers that this role's agents get; none by default
# prompt = "briefs/my-watchdog.md"        # a file that replaces the built-in start of this role's brief
# runtime = "subprocess"                  # if not set: [plugins.runtime] use
# writes = ["comments(finding)"]          # what the brief says the role may write; default: what piloop expects of it
# files = "seeds"                         # what its agents may file with `piloop idea`: nothing, seeds or ideas
runs = false                              # a sweeping role: its triggers start it and nothing it commits is scored
triggers = ["run_failed", "dead_at_startup", "leaking_funnel", "cron", "stopped"]  # names of [plugins.trigger.<name>]: incidents, the timer below, the stop
# sections = ["lessons", "goal", …]      # names of [plugins.section.<name>]; if not set: the installed sections of its briefs
interval = 1800                           # seconds between two progress reviews of the cron trigger; 0 turns it off
# continuity = "fresh"                   # or "resume": each sweep continues the last sweep's harness session
# incident_prompt = "briefs/incident.md"  # follows the prompt in a sweep that got anomalies; default: watchdog_incident.md
# routine_prompt = "briefs/review.md"     # follows the prompt in every other sweep; default: watchdog_progress.md
max_ideas = 1                             # new ideas per sweep for a low_water trigger; the watchdog files only seeds
timeout = 600
max_concurrent = 1

[plugins.role.research]                   # research keeps one runnable idea per run slot, plus the `buffer` of low_water
# harnesses = ["pi", "claude", "codex"]   # if not set: [plugins.harness] use
# model = { claude = "claude-opus-5-5", codex = "gpt-6.1-sol" }  # over the harnesses' model; a table replaces it
# effort = "high"                         # how hard its agents think, as the harness names it
# addendum = "briefs/research.md"         # a file appended to brief.md in this role's briefs only
# mcp = ["exa"]                           # the [plugins.mcp_server.<name>] servers that this role's agents get; none by default
# prompt = "briefs/my-research.md"        # a file that replaces the built-in start of this role's brief
# runtime = "subprocess"                  # if not set: [plugins.runtime] use
# writes = ["ideas via idea add"]         # what the brief says the role may write; default: what piloop expects of it
# files = "ideas"                         # what its agents may file with `piloop idea`: nothing, seeds or ideas
# plan_words = 150                         # the most words in the plan of an idea that its agents file
runs = false                              # a sweeping role
triggers = ["low_water", "seed", "stalled"]  # a short backlog (see [plugins.trigger.low_water] below), a new seed, a stall
# interval = 0                            # seconds between two sweeps of a cron trigger, if you add one
# sections = ["lessons", "goal", …]      # names of [plugins.section.<name>]; if not set: the installed sections of its briefs
# continuity = "fresh"                   # or "resume": each sweep continues the last sweep's harness session
# incident_prompt = "briefs/incident.md"  # follows the prompt in a sweep that got anomalies, if you add that trigger
# routine_prompt = "briefs/routine.md"    # follows the prompt in every other sweep; none by default
max_ideas = 3                             # new ideas per sweep, after the seeds; 0 pauses them (proposed)
timeout = 900
max_concurrent = 1                        # sweeps at the same time; more than one duplicate each other's work

[plugins.role.scout]                      # experimental: sweeps that search X, GitHub and arXiv for outside techniques
# harnesses = ["pi", "claude", "codex"]   # if not set: [plugins.harness] use
# model = { pi = "..." }                  # over the model of each [plugins.harness.<name>]
# effort = "high"                         # how hard its agents think, as the harness names it
# addendum = "briefs/scout.md"            # a file appended to brief.md in this role's briefs only
# mcp = ["xai"]                           # its search tools: an X search server, for example; none by default
# prompt = "briefs/my-scout.md"           # a file that replaces the built-in start of this role's brief
# runtime = "subprocess"                  # if not set: [plugins.runtime] use
# writes = ["seeds via idea seed"]        # what the brief says the role may write; default: what piloop expects of it
# files = "seeds"                         # what its agents may file with `piloop idea`: nothing, seeds or ideas
runs = false                              # a sweeping role
triggers = ["cron"]                       # the timer below
interval = 0                              # seconds between two scout sweeps; 0 (the default) turns the scout off
# continuity = "fresh"                   # or "resume": each sweep continues the last sweep's harness session
# incident_prompt = "briefs/incident.md"  # follows the prompt in a sweep that got anomalies, if you add that trigger
# routine_prompt = "briefs/routine.md"    # follows the prompt in every other sweep; none by default
seeds = 3                                 # the most seeds one scout sweep may file
# sections = ["lessons", "goal", …]      # names of [plugins.section.<name>]; if not set: the installed sections of its briefs
max_ideas = 1                             # new ideas per sweep for a low_water trigger; the scout files only seeds
timeout = 900
max_concurrent = 1

[plugins.role.orchestrator]               # piloop launches the campaign's orchestrator when news arrives for it
# harnesses = ["claude"]                  # if not set: [plugins.harness] use; it keeps the harness of its last session
# model = { claude = "claude-opus-5-5" }  # over the model of each [plugins.harness.<name>]
# effort = "high"                         # how hard its agents think, as the harness names it
# addendum = "briefs/orchestrator.md"     # a file appended to brief.md in this role's briefs only
# mcp = ["exa"]                           # the [plugins.mcp_server.<name>] servers that this role's agents get; none by default
# prompt = "briefs/my-orchestrator.md"    # a file that replaces the built-in start of this role's brief
# runtime = "subprocess"                  # if not set: [plugins.runtime] use
# writes = ["decisions"]                  # what the brief says the role may write; default: what piloop expects of it
# files = "ideas"                         # what its agents may file with `piloop idea`: nothing, seeds or ideas
runs = false                              # a sweeping role
triggers = []                             # off: you run your own orchestrator; ["news"] turns it on
# continuity = "resume"                   # each agent resumes the last one's session; "fresh" starts each anew
# interval = 0                            # seconds between two sweeps of a cron trigger, if you add one
# sections = ["inbox", …]                # if not set: a lean status after the news
# incident_prompt = "briefs/incident.md"  # follows the prompt in a sweep that got anomalies, if you add that trigger
# routine_prompt = "briefs/routine.md"    # follows the prompt in every other sweep; none by default
# max_ideas = 1                           # new ideas per sweep for a low_water trigger, if you add one
timeout = 900
max_concurrent = 1                        # at most 1: two orchestrators would answer the same news twice

# [plugins.role.reviewer]                 # a role of your own: any new name; it needs a prompt and triggers
# prompt = "briefs/reviewer.md"           # the file that starts its brief
# triggers = ["new_keep"]                # names of [plugins.trigger.<name>], such as the one below
# max_concurrent = 1                      # it takes every key of [plugins.role.watchdog] except its defaults

# [plugins.role.quick]                    # a role of your own that does runs: any new name with runs = true
# runs = true                             # it takes every key and default of [plugins.role.implementer], its prompt included
# takes = "priority >= 3"                 # the ideas it takes; its slots fill before the implementer's
# timeout = 300
# max_concurrent = 2

# [agents]                                # the agents' timings and the brief's budget; if not set: the home's [agents]
# wrap_up_grace = 600                     # seconds to save their work after a stop or a cancel with --wrap-up
# finding_grace = 60                      # seconds after its finding before an implementer is ended
# brief_words = 400                       # init and doctor warn when brief.md is longer

# [plugins.trigger.new_keep]             # a trigger with parameters, which a role names in its triggers
# provider = "sql"                        # a new name needs its provider; a built-in name, such as low_water, is that one
# when = "SELECT 1 FROM candidates WHERE campaign_id = :campaign AND verdict = 'keep' AND created_at > :since"

# [plugins.trigger.low_water]             # a built-in trigger's table changes its parameters for every role that names it
# buffer = 2                              # ideas to keep ready beyond one per run slot

# [plugins.trigger.cron]
# max_interval = 14400                    # seconds after which a routine sweep starts also when nothing is new

# [plugins.section]                       # what `piloop status`, the API and a UI show
# use = ["headline", "goal", …]           # if not set: the installed sections of status; see the sections

# [plugins.section.research_lessons]      # a section with parameters, which a list of sections names
# provider = "lessons"
# budget = 800

# [plugins.<name>]                        # the provider of a capability that a plugin package adds, by its name
# provider = "<name>"                     # the other keys of the table are its parameters; `piloop plugins` lists them
#                                         # a capability of several instances: [plugins.<name>.<instance>] for each

# [plugins.verdict_rule]                  # how a candidate is judged; without the table: bootstrap
# confidence = 0.95                       # a keep needs the primary metric's gain to be above zero at this confidence

# [plugins.stop_rule]                     # the limits of the built-in rule `limits`; any one ends the campaign; none: no end
# target = 0.85                           # the primary metric at the head reaches this value (one track only)
# max_runs = 200                          # runs of every role that reached the evaluator (a scored commit)
# max_hours = 12                          # hours since the campaign's first run started
# max_tokens = 50000000                   # tokens that all the agents of the campaign spent together
# plateau = 50                            # runs counted as for max_runs, since the last keep or reactivation
# hold_at = { spend = 1000 }              # facts of the fact sources at which nothing starts; raise one, then `piloop init` again
# while_held = "run"                      # the closing review of a stop while held: run | skip | wait (until the hold ends)

# [plugins.fact_source]                   # where the facts of the stop rule and the sections come from
# use = ["campaign", "optimization", "billing", "spend"]  # if not set: campaign (hours, tokens) and optimization (the research)
#                                         # a source with a table must be in use; a list lists campaign and optimization too
# [plugins.fact_source.billing]           # a source with parameters
# provider = "command"                    # a command that writes {"metrics": …} to $PILOOP_RESULT_FILE, as the evaluate command does
# command = ["uv", "run", "scripts/bill.py"]  # runs at the repo root; it gets secrets from the daemon's environment
# metrics = ["billing_usd"]               # the names that it prints, each a fact of the campaign
# notices = { billing_usd = [300, 600] }  # piloop posts one inbox note when a value crosses each
# interval = 300                          # seconds between two readings
# [plugins.fact_source.spend]             # spend: the sum of facts in USD, which hold_at and the cost section read
# facts = ["billing_usd"]                 # default: compute_usd and models_usd, of the leases and models sources

# [plugins.vcs]                           # how the campaign saves versions; default: git
# email = "piloop@localhost"              # of every commit that piloop makes or launches, whatever git's config says

# [plugins.memory]                        # what past campaigns leave for the next ones; see the research memory page
# documents = ["docs/evidence/**/*.md"]   # repo files that `piloop init` and the stop copy into `documents`; default none

[[metrics]]                               # one entry for each metric that evaluate reports; one primary for each track
name = "score"
direction = "higher"                      # higher | lower
role = "primary"                          # primary: must beat the head · guardrail · watch (the default)
# track = "score"                         # primaries only; the track this metric decides; default: the metric's name

# [[metrics]]                             # a guardrail may get worse by at most `margin` (else interesting) and never past `floor` (else discard)
# name = "latency_ms"
# direction = "lower"
# role = "guardrail"
# margin = 20                             # in the metric's own units, compared with the run's bar
# fraction = 0.1                         # instead of margin: a fraction of the bar's value (0.1 = 10%)
# ratio = { numerator = "cost_usd", denominator = "solved" }  # computed by piloop; keys: numerator, denominator
# floor = 500                             # optional hard limit on the value
# repeats = 3                             # a noisy metric (a time): each candidate runs 3 times next to its bar

# [[ladder]]                             # a rung that a run's own version climbs before the full panel, cheapest first
# name = "screen"                         # evaluate reports it first, as a line with "rung": "screen"
# stop = { score = { margin = 0.05 } }    # when the climb stops here, with a guardrail's keys: floor, margin, fraction
# evaluate = ["uv", "run", "python", "smoke.py"]  # optional: a command of its own that reports this rung; such rungs come first

# [tracks.<name>]                         # experimental: one table for each track when several metrics are primary
# share = 1                               # the fraction of each role's run slots for this track; shares sum to 1
# addendum = "briefs/speed.md"            # a file appended to the brief of this track's runs
