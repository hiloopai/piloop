# Two objectives as tracks on one pool. Reference: https://piloop.autoresearch.inc/concepts/tracks
# The best of a track has the best primary metric of its track. It must also keep the other track's primary metric
# within its margin of the baseline and on the right side of its floor.
name = "titanic-tracks"
evaluate = ["uv", "run", "python", "evaluate.py"]
evaluate_timeout = 300
link = ["data", ".venv"]

[plugins.runtime]
use = "subprocess"

[plugins.harness]
use = ["pi", "claude", "codex"]

[plugins.harness.pi]
model = "anthropic/claude-opus-5-5"

[plugins.harness.claude]
model = "claude-opus-5-5"

[plugins.harness.codex]
model = "gpt-6.1-sol"

[plugins.role.implementer]
timeout = 900

[[metrics]]
name = "accuracy"
direction = "higher"
role = "primary"
track = "accuracy"
margin = 0.02          # the best of the cost track may lose at most this much accuracy against the baseline
floor = 0.74           # the best of the cost track may never push accuracy below this

[[metrics]]
name = "cost_seconds"
direction = "lower"
role = "primary"
track = "cost"
margin = 0.3           # how much the best of the accuracy track may add to the baseline, in CPU seconds
floor = 2.0            # the best of the accuracy track may not make the CPU cost higher than this

[tracks.accuracy]
addendum = "briefs/accuracy.md"

[tracks.cost]
addendum = "briefs/cost.md"
