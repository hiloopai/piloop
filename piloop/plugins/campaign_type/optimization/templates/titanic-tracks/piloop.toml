# Two objectives as tracks on one trunk. Reference: https://piloop.autoresearch.inc/concepts/tracks
# A keep improves the primary metric of its own track with confidence. It must also keep the other track's
# primary metric within its margin and on the right side of its floor.
name = "titanic-tracks"
evaluate = ["uv", "run", "python", "evaluate.py"]
evaluate_timeout = 300
link = ["data", ".venv"]

[plugins.runtime]
use = "subprocess"

[plugins.harness]
use = ["pi", "claude", "codex"]

[plugins.harness.pi]
model = "anthropic/claude-opus-5-5"

[plugins.harness.claude]
model = "claude-opus-5-5"

[plugins.harness.codex]
model = "gpt-6.1-sol"

[plugins.role.implementer]
timeout = 900

[[metrics]]
name = "accuracy"
direction = "higher"
role = "primary"
track = "accuracy"
margin = 0.02          # bounds the paired 95% worst case, not the mean: a cost keep must keep nearly every prediction
floor = 0.74           # a cost keep may never push accuracy below this

[[metrics]]
name = "cost_seconds"
direction = "lower"
role = "primary"
track = "cost"
margin = 0.3           # how much an accuracy keep may add per step, in CPU seconds
floor = 2.0            # an accuracy keep may not make the CPU cost higher than this
repeats = 3            # a time: measure each candidate 3 times next to its bar

[tracks.accuracy]
share = 0.75
addendum = "briefs/accuracy.md"

[tracks.cost]
share = 0.25
addendum = "briefs/cost.md"
