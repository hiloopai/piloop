# Every key: https://piloop.autoresearch.inc/reference/configuration
name = "enwik8"
evaluate = ["uv", "run", "python", "evaluate.py"]
evaluate_timeout = 900
link = ["data", ".venv"]

[plugins.runtime]
use = "subprocess"

[plugins.harness]
use = ["claude"]                   # add "codex" or "pi" if you have them, and uncomment its table

[plugins.harness.claude]
model = "claude-opus-5-5"

# [plugins.harness.pi]
# model = "anthropic/claude-opus-5-5"

# [plugins.harness.codex]
# model = "gpt-6.1-sol"

[plugins.stop_rule]
max_runs = 20                            # the campaign ends after 20 scored implementer runs

[plugins.role.implementer]
timeout = 1800
max_concurrent = 2

[[metrics]]
name = "bytes"
direction = "lower"
role = "primary"

[[metrics]]
name = "seconds"
direction = "lower"
role = "guardrail"
margin = 60
floor = 120
repeats = 3                              # a time: measure each candidate 3 times next to its bar
