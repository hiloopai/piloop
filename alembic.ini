# Only used by `uv run alembic [--name <schema>] revision --autogenerate`; runtime migrations go through
# piloop.db.session.migrate. One section per schema (piloop.db.schema): [alembic] is core's, the others plugins'.
[DEFAULT]
script_location = piloop/db/migrations
prepend_sys_path = .
path_separator = os
sqlalchemy.url = sqlite:///.alembic-scratch.db

[alembic]

[optimization]
version_locations = piloop/plugins/campaign_type/optimization/migrations

[archive/local]
version_locations = piloop/plugins/archive/local/migrations
